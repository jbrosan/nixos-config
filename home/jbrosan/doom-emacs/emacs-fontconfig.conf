<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Isolate Nix Emacs from newer host Fontconfig rules it cannot parse. -->
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir>/home/jbrosan/.local/share/fonts</dir>
  <include ignore_missing="yes">/home/jbrosan/.config/fontconfig/conf.d</include>
  <cachedir>/home/jbrosan/.cache/fontconfig</cachedir>
</fontconfig>
